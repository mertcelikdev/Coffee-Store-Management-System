<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özçelik Coffee - Kahveler</title>

    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap');

        /* Genel Sayfa Stili */
        body {
            font-family: 'Urbanist', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 0 20px; /* Sayfa kenarlarına boşluk ekliyoruz */
        }

        /* Header */
        header h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-top: 20px;
            color: #333;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 2px;
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            border-radius: 0 0 20px 20px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Sol Kısım: Logo, Hakkımızda, İletişim */
        .navbar-left {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .navbar-left .navbar-brand img {
            height: 35px; /* Logo boyutu */
        }

        .navbar-left .nav-link {
            color: white;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .navbar-left .nav-link:hover {
            color: #ff8c00;
        }

        /* Sağ Kısım: Kahveler, Tatlılar, Giriş Yap, Çıkış Yap */
        .navbar-right {
            display: flex;
            gap: 15px;
        }

        .navbar-right .nav-link {
            color: white;
            font-weight: 500;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .navbar-right .nav-link:hover {
            background-color: #ff8c00;
            color: white;
        }

        /* Kahve Listesi */
        .coffee-container {
            display: grid; /* Grid sistemi kullanıyoruz */
            grid-template-columns: repeat(4, 1fr); /* 4 sütunlu grid */
            gap: 20px; /* Elemanlar arasındaki boşluk */
            padding: 20px;
            margin: 0 auto; /* Ortalamayı sağlıyoruz */
            max-width: 1200px; /* Maksimum genişlik veriyoruz */
        }

        .coffee-item {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            padding: 10px;
            text-align: center;
            position: relative;
            overflow: hidden; /* İçerik dışarı taşarsa gizle */
        }

        .coffee-item img {
            width: 100%; /* Görsellerin genişliğini kapsayıcıya göre ayarlıyoruz */
            height: 200px; /* Yüksekliği sabitliyoruz */
            object-fit: cover; /* Görselin en/boy oranını koruyarak, kapsayıcıya uyacak şekilde kesilmesini sağlıyoruz */
            border-radius: 8px;
            margin-bottom: 10px;
        }

        /* CRUD butonları için gizleme ve gösterme */
        .crud-buttons {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 5px;
            border-radius: 5px;
        }

        .coffee-item:hover .crud-buttons {
            display: block;
        }

        .crud-buttons a {
            color: white;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
            margin: 0 5px;
            background-color: rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s ease;
        }

        .crud-buttons a:hover {
            background-color: #ff8c00;
        }

        /* Ekleme Butonu */
        .add-button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #2575fc;
            color: white;
            font-size: 1.2rem;
            border: none;
            border-radius: 5px;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .add-button:hover {
            background-color: #6a11cb;
        }

        /* Footer */
        .footer {
            background-color: #333;
            color: white;
            font-size: 1rem;
            text-align: center;
            padding: 20px;
            margin-top: auto;
        }

        /* Mobil uyum için genişlikleri daha küçük ayarlayalım */
        @media (max-width: 768px) {
            .coffee-container {
                grid-template-columns: repeat(2, 1fr); /* Mobilde 2 sütun */
            }
        }

        @media (max-width: 480px) {
            .coffee-container {
                grid-template-columns: 1fr; /* Çok küçük ekranlarda 1 sütun */
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Özçelik Coffee - Kahveler</h1>
</header>

<nav class="navbar">
    <div class="navbar-left">
        <a class="navbar-brand" href="/"><img src="/images/logo.jpeg" alt="Özçelik Coffee Logo"></a>
        <a class="nav-link" href="/about">Hakkımızda</a>
        <a class="nav-link" href="/contact">İletişim</a>
    </div>

    <div class="navbar-right">
        <a class="nav-link" href="/coffees">Kahveler</a>
        <a class="nav-link" href="/desserts">Tatlılar</a>
        <a class="nav-link" href="/login">Giriş Yap</a>
        <a class="nav-link" href="/logout">Çıkış Yap</a>
    </div>
</nav>


<!--

<div sec:authorize="hasRole('ROLE_ADMIN')">
    <a href="/coffees/add" class="add-button">Yeni Tatlı Ekle</a> ADMİN GİRİŞİ
</div>
-->
<!-- Ekleme Butonu -->
<a href="/coffees/add"  class="add-button">Yeni Kahve Ekle</a>

<div class="coffee-container">
    <div class="coffee-item" th:each= "coffee : ${coffees}">
        <!-- Görseli göster -->
        <img th:src="@{/images/coffees/{imageName}(imageName=${coffee.images})}" alt="coffee">
        <h2 th:text="${coffee.name}">İsim</h2>
        <h3 th:text="${coffee.type}">Tür</h3>
        <h3 th:text="${coffee.size}">Boyut</h3>
        <p th:text="'Fiyat: ' + ${coffee.price} + ' TL'">Fiyat</p>
        <p th:text="'Stok: ' + ${coffee.stock}">Stok</p>

        <!-- CRUD Butonları -->
        <div class="crud-buttons">
            <a th:href="@{/coffees/update/{id}(id=${coffee.coffee_id})}">Düzenle</a>
            <a href="#" th:onclick="'deleteCoffee(' + ${coffee.coffee_id} + ')'">Sil</a>


        </div>
    </div>
</div>

<footer class="footer">
    <p>&copy; 2024 Özçelik Coffee. All rights reserved.</p>
</footer>

<script>
    function deleteCoffee(coffee_id) {
        if (confirm('Emin misiniz?')) {
            fetch(`/coffees/delete/${coffee_id}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: '_method=DELETE',
            })
                .then(response => {
                    if (response.ok) {
                        alert('Silme işlemi başarılı!');
                        location.reload(); // Sayfayı yeniler
                    } else {
                        alert(`Silme işlemi başarısız oldu! Hata Kodu: ${response.status}`);
                    }
                })
                .catch(error => {
                    console.error('Hata:', error);
                    alert('Bir hata oluştu!');
                });
        }
    }

</script>
</body>
</html>
