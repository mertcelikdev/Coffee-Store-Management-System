<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Urbanist', sans-serif;
            background-color: #f8f9fa;
        }
        h2 {
            font-weight: 700;
            font-size: 2.5rem;
            color: #343a40;
            margin-bottom: 20px;
        }
        table {
            font-size: 1.1rem;
        }
        th, td {
            text-align: center;
            vertical-align: middle;
        }
        .btn {
            font-size: 1rem;
            padding: 8px 16px;
        }
        .btn-warning {
            background-color: #ffc107;
            border-color: #ffc107;
        }
        .btn-warning:hover {
            background-color: #e0a800;
            border-color: #d39e00;
        }
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }
        /* Go Home Button Ortalamak için CSS */
        .go-home-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 20px; /* Table ile arada biraz boşluk bırakmak için */
        }
        /* Resim boyutlandırma */
        .employee-image {
            width: 150px;
            height: 150px;
            object-fit: cover; /* Resmi uygun şekilde keserek sığdırır */
        }
    </style>
</head>
<body>

<div class="container my-5">
    <h2 class="text-center">Employee List</h2>

    <!-- Add New Employee Button -->
    <a href="/employees/add" class="btn btn-primary mb-4">Add New Employee</a>

    <!-- Employee Table -->
    <table class="table table-striped table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Salary</th>
            <th>Image</th> <!-- Yeni sütun ekledik -->
            <th>Actions</th> <!-- Actions sütunu en sağda kalacak -->
        </tr>
        </thead>
        <tbody>
        <tr th:each="employee : ${employees}">
            <td th:text="${employee.employeeId}"></td>
            <td th:text="${employee.firstName}"></td>
            <td th:text="${employee.lastName}"></td>
            <td th:text="${employee.email}"></td>
            <td th:text="${employee.role.name}"></td>
            <td th:text="${employee.salary}"></td>

            <!-- Resim sütununu buraya ekliyoruz -->
            <td>
                <img th:src="@{'/images/employees/' + ${employee.imageUrl}}" alt="Employee Image" class="employee-image">
            </td>

            <td>
                <a th:href="@{/employees/update/{id}(id=${employee.employeeId})}" class="btn btn-warning btn-sm">Edit</a>
                <a th:href="@{/employees/delete/{id}(id=${employee.employeeId})}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Go Home Button (Ortada ve Container Altında) -->
    <div class="go-home-btn-container">
        <a href="/" class="btn btn-secondary">Go Home</a>
    </div>
</div>

</body>
</html>
