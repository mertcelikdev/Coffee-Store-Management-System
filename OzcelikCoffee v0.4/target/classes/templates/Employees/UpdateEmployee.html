<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@100;400;600;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Urbanist', sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .img-preview {
            max-width: 200px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<h2>Update Employee</h2>
<div class="form-container">
    <form method="post" th:action="@{/employees/update/{id}(id=${employee.employeeId})}" th:object="${employee}" enctype="multipart/form-data">
        <input type="hidden" th:field="*{employeeId}" />

        <div class="mb-3">
            <label for="firstName" class="form-label">First Name:</label>
            <input id="firstName" type="text" th:field="*{firstName}" class="form-control" placeholder="Enter First Name" required>
        </div>

        <div class="mb-3">
            <label for="lastName" class="form-label">Last Name:</label>
            <input id="lastName" type="text" th:field="*{lastName}" class="form-control" placeholder="Enter Last Name" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input id="email" type="email" th:field="*{email}" class="form-control" placeholder="Enter Email" required>
        </div>

        <div class="mb-3">
            <label for="role" class="form-label">Role:</label>
            <select id="role" th:field="*{role.id}" class="form-select" required>
                <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}">Role</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="salary" class="form-label">Salary:</label>
            <input id="salary" type="number" th:field="*{salary}" class="form-control" step="0.01" placeholder="Enter Salary" required>
        </div>

        <div class="mb-3">
            <label for="image" class="form-label">Employee Image:</label>
            <input id="image" type="file" name="image" class="form-control" accept="image/*">
            <!-- Eğer daha önce görsel yüklenmişse, onu gösterebiliriz -->
            <div>
                <img th:if="${employee.imageUrl != null}" th:src="@{${employee.imageUrl}}" alt="Employee Image" class="img-preview">
            </div>
        </div>

        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-success">Update Employee</button>
            <a class="btn btn-secondary" href="/employees">Back to Employees</a>
        </div>
    </form>
</div>



</body>
</html>
