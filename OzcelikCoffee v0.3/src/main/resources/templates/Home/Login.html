<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- Türkçe karakterler için gerekli meta etiket -->
    <title>Login - Özçelik Coffee</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f4f9; /* Hafif gri arka plan */
            font-family: 'Urbanist', sans-serif;
        }

        .login-container {
            margin-top: 5%;
            padding: 2rem;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-control {
            border: 1px solid #ced4da;
            border-radius: 5px;
        }

        .alert-danger {
            color: #dc3545;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #6a11cb;
            border: none;
        }

        .btn-primary:hover {
            background-color: #2575fc;
        }

        .btn-secondary {
            background-color: #6c757d;
            border: none;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }

        /* Responsive Düzenlemeler */
        @media (max-width: 767px) {
            .login-container {
                padding: 1rem;
                margin-top: 15%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 login-container">
            <h1> Giriş Yap</h1>

            <!-- Login Formu -->
            <form  th:action="@{/authenticateTheUser}" method="POST">

                <div class="form-group">
                    <label for="email">E-Posta</label>
                    <input type="text" id="email" name="email" class="form-control" required/>
                </div>

                <div class="form-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" name="password" class="form-control" required/>
                </div>

                <button type="submit" class="btn btn-primary btn-block mt-3">
                    Giriş Yap
                </button>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS ve jQuery (Opsiyonel) -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
